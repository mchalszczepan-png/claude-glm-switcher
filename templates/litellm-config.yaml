# =============================================================================
# LiteLLM config — example for use with claude-glm-switcher's litellm mode
#
# Save this as ~/.litellm/config.yaml and start with:
#   litellm --config ~/.litellm/config.yaml
#
# LiteLLM then runs on http://localhost:4000 and translates between
# Claude Code's Anthropic API format and each provider's native format.
#
# Install: pip install litellm
# Docs:    https://docs.litellm.ai/docs/proxy/quick_start
# =============================================================================

model_list:

  # --- OpenAI / ChatGPT ---
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: "YOUR_OPENAI_API_KEY_HERE"

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: "YOUR_OPENAI_API_KEY_HERE"

  # --- Google Gemini ---
  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: "YOUR_GOOGLE_AI_STUDIO_KEY_HERE"

  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: "YOUR_GOOGLE_AI_STUDIO_KEY_HERE"

  # --- Groq (very fast inference) ---
  - model_name: llama-3.3-70b
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: "YOUR_GROQ_API_KEY_HERE"

  - model_name: deepseek-r1
    litellm_params:
      model: groq/deepseek-r1-distill-llama-70b
      api_key: "YOUR_GROQ_API_KEY_HERE"

# LiteLLM proxy settings
litellm_settings:
  drop_params: true      # Ignore unsupported params instead of erroring
  set_verbose: false

general_settings:
  master_key: "YOUR_LITELLM_MASTER_KEY_HERE"   # Set this in CONFIG.sh/CONFIG.ps1 as your litellm API key
  # This key is what Claude Code sends as ANTHROPIC_AUTH_TOKEN when in litellm mode
